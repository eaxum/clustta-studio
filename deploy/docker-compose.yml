# Clustta Studio — Standalone (default)
# No reverse proxy. App listens directly on port 7774.
# Use this if you already have nginx/Caddy/Cloudflare Tunnel,
# or just want to run Clustta on a local network.
#
# Usage:
#   docker compose up -d

services:
  app:
    image: eaxum/clustta:latest
    ports:
      - "7774:7774"
    env_file:
      - .env
    environment:
      DATA_DIR: /var/data
      PROJECTS_DIR: /var/projects
      STORAGE_DIR: /var/storage
    volumes:
      - ${HOST_DATA_DIR:-${DATA_FOLDER:-./data}}:/var/data/
      - ${HOST_PROJECTS_DIR:-${PROJECTS_FOLDER:-./projects}}:/var/projects/
      - ${HOST_STORAGE_DIR:-${STORAGE_FOLDER:-./storage}}:/var/storage/
    restart: unless-stopped
